[project]
name = "booking-system"
version = "0.1.0"
description = "\"Simple booking system\""
authors = [
    {name = "Dima Oshchepkov",email = "odo.2003@yandex.ru"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "app"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "types-passlib (>=1.7.7.20260211,<2.0.0.0)"
]
